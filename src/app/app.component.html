<app-layout [style.visibility]="isLocked ? 'hidden' : 'visible'"></app-layout>
@if (onboardingService.shouldShowOnboarding()) {
  <app-onboarding [style.visibility]="isLocked ? 'hidden' : 'visible'"></app-onboarding>
}

@if (isLocked) {
  <div class="lock-screen">
    <div class="lock-content">
      <ion-icon name="finger-print-outline" size="large"></ion-icon>
      <h2>{{ "SETTINGS.BIOMETRIC" | translate }}</h2>
      <p>{{ "SETTINGS.BIOMETRIC_DESC" | translate }}</p>
      <ion-button (click)="checkBiometric()" fill="clear">
        {{ "COMMON.RETRY" | translate }}
      </ion-button>
    </div>
  </div>
}
