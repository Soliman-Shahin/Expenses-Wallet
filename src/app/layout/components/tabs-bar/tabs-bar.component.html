@if (vm$ | async; as vm) {
<!-- Navigation is owned by the persistent outlet in LayoutComponent. -->
@if (vm.isLoggedIn) {
<!-- The actual tab bar -->
<ion-tab-bar slot="bottom">
  @for (tab of tabs; track tab) { @if (tab.visible) {
  <ion-tab-button
    (click)="navigateTab(tab.routerLink, $event)"
    [class.tab-selected]="
      vm.activeRoute === tab.routerLink ||
      (tab.routerLink !== '/' && vm.activeRoute.startsWith(tab.routerLink))
    "
  >
    <ion-icon [name]="tab.icon"></ion-icon>
    @if (tab.show_label) {
    <ion-label>{{ tab.label ?? "" | translate }}</ion-label>
    }
  </ion-tab-button>
  } }
</ion-tab-bar>
} }
