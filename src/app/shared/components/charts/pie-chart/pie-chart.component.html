<div class="chart-container" [attr.aria-label]="ariaLabel">
  <div class="chart-header">
    <h3 *ngIf="title" class="chart-title">{{ title }}</h3>
    <div class="chart-legend" *ngIf="showLegend">
      <div
        *ngFor="let item of chartData; let i = index"
        class="legend-item"
        (click)="toggleSeries(i)"
        [class.inactive]="!isSeriesVisible(i)"
        tabindex="0"
        (keyup.enter)="toggleSeries(i)"
        (keyup.space)="toggleSeries(i); $event.preventDefault()"
      >
        <div class="legend-color" [style.background-color]="getColor(i)"></div>
        <span class="legend-label">{{ item.name || "—" }}</span>
        <span class="legend-value">{{ item.value | number : "1.0-0" }}</span>
      </div>
    </div>
  </div>

  <div class="chart-wrapper" #chartWrapper>
    <div class="pie-chart">
      <svg [attr.viewBox]="getViewBox()" xmlns="http://www.w3.org/2000/svg">
        <g [attr.transform]="getTransform()">
          <path
            *ngFor="let slice of slices; let i = index"
            [attr.d]="slice.path"
            [attr.fill]="slice.color"
            [attr.stroke]="strokeColor"
            [attr.stroke-width]="strokeWidth"
            [attr.aria-label]="getAriaLabel(slice, i)"
            [class.inactive]="!isSeriesVisible(i)"
            (mouseenter)="showTooltip($event, i)"
            (mouseleave)="hideTooltip()"
            (focus)="showTooltip($event, i)"
            (blur)="hideTooltip()"
            tabindex="0"
            role="button"
            [attr.data-index]="i"
          />
        </g>
      </svg>
    </div>

    <app-chart-tooltip
      #tooltip
      [title]="tooltipTitle"
      [items]="tooltipItems"
      [visible]="isTooltipVisible"
      [position]="tooltipPosition"
      [isDarkMode]="isDarkMode"
      [format]="tooltipFormat"
      [borderColor]="activeSliceColor"
    ></app-chart-tooltip>
  </div>
</div>
