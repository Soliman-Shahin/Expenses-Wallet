<ion-header translucent>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/categories/list"></ion-back-button>
    </ion-buttons>
    <ion-title>{{
      (editMode ? "CATEGORY.EDIT" : "CATEGORY.ADD") | translate
    }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Live preview -->
  <div class="preview" [class.bump]="animatePreview">
    <span
      class="category-icon"
      [style.background]="categoryForm.get('color')?.value"
    >
      <ion-icon
        size="large"
        [name]="categoryForm.get('icon')?.value"
      ></ion-icon>
    </span>
    <div class="preview-title">
      {{ categoryForm.get("title")?.value || ("TITLE" | translate) }}
    </div>
  </div>

  <ion-card class="form-card">
    <form [formGroup]="categoryForm">
      <ion-grid class="form-grid">
        <ion-row>
          <ion-col size="12">
            <ion-item class="rounded-item" lines="full">
              <ion-input
                formControlName="title"
                [placeholder]="'CATEGORY.TITLE_PLACEHOLDER' | translate"
                class="modern-input"
                maxlength="50"
                counter="true"
              ></ion-input>
              <ion-icon
                name="create-outline"
                slot="start"
              ></ion-icon>
              <ion-icon
                *ngIf="categoryForm.get('title')?.invalid && categoryForm.get('title')?.touched && formSubmitted"
                name="alert-circle"
                color="danger"
                slot="end"
                class="error-icon"
              ></ion-icon>
            </ion-item>
            <ion-note
              class="field-error animated"
              color="danger"
              *ngIf="
                categoryForm.get('title')?.invalid &&
                (categoryForm.get('title')?.dirty ||
                  categoryForm.get('title')?.touched)
              "
            >
              <ion-icon name="alert-circle-outline"></ion-icon>
              {{ "VALIDATION.REQUIRED" | translate }}
            </ion-note>
          </ion-col>
        </ion-row>

        <ion-row class="mt-4">
          <ion-col size="12">
            <div class="section-title">
              <ion-text color="medium">{{
                "CATEGORY.COLOR" | translate
              }}</ion-text>
              <div class="divider"></div>
            </div>
          </ion-col>
          <app-color-selector
            class="color-selector"
            [selectedColor]="categoryForm.get('color')?.value"
            (color)="selectColor($event)"
            [attr.aria-label]="'CATEGORY.SELECT_COLOR' | translate"
            role="radiogroup"
          />
        </ion-row>

        <ion-row class="mt-4">
          <ion-col size="12">
            <div class="section-title">
              <ion-text color="medium">{{
                "CATEGORY.ICON" | translate
              }}</ion-text>
              <div class="divider"></div>
            </div>
          </ion-col>
          <app-icon-selector
            class="icon-selector"
            [selectedIcon]="categoryForm.get('icon')?.value"
            (icon)="selectIcon($event)"
            [attr.aria-label]="'CATEGORY.SELECT_ICON' | translate"
            role="radiogroup"
          />
        </ion-row>

        <ion-row class="mt-4">
          <ion-col>
            <ion-button
              class="action-button"
              [class.loading]="isLoading"
              [class.success]="formSubmitted && !isLoading"
              (click)="editMode ? updateCategory() : addCategory()"
              expand="block"
              shape="round"
              size="large"
              strong
              [disabled]="!categoryForm.valid || isLoading"
              [attr.aria-label]="
                (editMode ? 'CATEGORY.UPDATE' : 'CATEGORY.CREATE') | translate
              "
            >
              <div class="button-content">
                <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
                <ion-icon 
                  *ngIf="formSubmitted && !isLoading" 
                  name="checkmark-circle" 
                  class="success-icon">
                </ion-icon>
                <span class="button-text">
                  {{ (editMode ? "UPDATE" : "CREATE") | translate }}
                </span>
              </div>
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </form>
  </ion-card>
</ion-content>
