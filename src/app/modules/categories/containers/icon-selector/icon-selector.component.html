<div class="icon-selector-container">
  @for (icon of icons; track trackByIcon($index, icon)) {
    <ion-icon
      class="icon"
      [class.selected]="selectedIcon === icon"
      [name]="icon"
      size="large"
      [title]="icon"
      [attr.aria-label]="icon"
      [attr.aria-pressed]="selectedIcon === icon"
      role="radio"
      tabindex="0"
      (click)="selectIcon(icon)"
      (keydown.enter)="selectIcon(icon)"
      (keydown.space)="selectIcon(icon)"
    ></ion-icon>
  }
</div>
